services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: novel-comic-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      IMAGE_PROVIDER: ${IMAGE_PROVIDER:-qwen}
      QWEN_IMAGE_MODEL: ${QWEN_IMAGE_MODEL:-qwen-image-3.0}
      DATABASE_URL: sqlite:////var/lib/maneko/novels.db
      UPLOAD_DIR: /var/lib/maneko/uploads
      COMIC_DIR: /var/lib/maneko/comics
      CORS_ORIGINS: '${CORS_ORIGINS:-["http://localhost:5173","http://127.0.0.1:5173"]}'
    volumes:
      - ./data:/var/lib/maneko
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: novel-comic-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
