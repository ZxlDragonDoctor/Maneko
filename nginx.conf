server {
    listen 80;
    server_name localhost;
    
    # 前端静态文件
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
    
    # API代理
    location /api {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    
    # 漫画图片代理
    location /comics {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }
    
    # 上传文件代理
    location /uploads {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }
}