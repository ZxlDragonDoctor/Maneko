# Render.com persistent FastAPI backend for Maneko
# Dashboard: New → Blueprint → 连接本仓库；或手动 New Web Service
services:
  - type: web
    name: maneko-api
    runtime: docker
    # Persistent disks require a paid Render instance; do not deploy user data to ephemeral storage.
    plan: starter
    rootDir: .
    dockerfilePath: ./Dockerfile.backend
    dockerContext: .
    healthCheckPath: /ready
    envVars:
      # 必填：阿里云 DashScope Key；/ready 会检查分章模型凭据。
      - key: DASHSCOPE_API_KEY
        sync: false
      # 正式服务必须使用真实图像提供方；/ready 拒绝 mock。
      - key: IMAGE_PROVIDER
        value: qwen
      - key: QWEN_IMAGE_MODEL
        value: qwen-image-3.0
      - key: QWEN_IMAGE_MODE
        value: sdk
      - key: DATABASE_URL
        value: sqlite:////var/data/novels.db
      - key: UPLOAD_DIR
        value: /var/data/uploads
      - key: COMIC_DIR
        value: /var/data/comics
      # 精确的生产 Web origin + Capacitor WebView origin
      - key: CORS_ORIGINS
        value: '["https://localhost","capacitor://localhost","https://maneko.vercel.app"]'
    disk:
      name: maneko-data
      mountPath: /var/data
      sizeGB: 2
